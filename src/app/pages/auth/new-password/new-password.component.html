<div class="auth-container">
  <div class="auth-card">
    <div class="logo-section">
      <img src="assets/images/pharamalink-logo-transparent-1.PNG" alt="PharmaLink Logo" class="logo">
      <h1>Reset Password</h1>
      <p class="subtitle">Enter your new password below</p>
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="auth-form">
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>New Password</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" 
               formControlName="password" 
               placeholder="Enter your new password">
        <button mat-icon-button matSuffix type="button"
                (click)="hidePassword = !hidePassword">
          <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
        <mat-error *ngIf="getErrorMessage('password')">
          {{ getErrorMessage('password') }}
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Confirm Password</mat-label>
        <input matInput [type]="hideConfirmPassword ? 'password' : 'text'" 
               formControlName="confirmPassword" 
               placeholder="Confirm your new password">
        <button mat-icon-button matSuffix type="button"
                (click)="hideConfirmPassword = !hideConfirmPassword">
          <mat-icon>{{hideConfirmPassword ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
        <mat-error *ngIf="getErrorMessage('confirmPassword')">
          {{ getErrorMessage('confirmPassword') }}
        </mat-error>
      </mat-form-field>

      <button mat-flat-button color="primary" class="submit-button" type="submit" 
              [disabled]="resetForm.invalid || isLoading">
        <span *ngIf="!isLoading">Reset Password</span>
        <mat-spinner diameter="20" *ngIf="isLoading"></mat-spinner>
      </button>

      <div class="form-footer">
        <a routerLink="/login" class="back-link">
          <mat-icon>arrow_back</mat-icon>
          Back to Login
        </a>
      </div>
    </form>
  </div>
</div>
