<div class="auth-container">
  <div class="auth-card">
    <div class="logo-section">
      <img src="assets/images/pharamalink-logo-transparent-1.PNG" alt="PharmaLink Logo" class="logo">
      <h1>Forgot Password</h1>
      <p class="subtitle">Enter your email to reset your password</p>
    </div>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="auth-form">
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" placeholder="Enter your email">
        <mat-error *ngIf="getErrorMessage('email')">
          {{ getErrorMessage('email') }}
        </mat-error>
      </mat-form-field>

      <button mat-flat-button color="primary" class="submit-button" type="submit" 
              [disabled]="forgotPasswordForm.invalid || isLoading">
        <span *ngIf="!isLoading">Send Reset Instructions</span>
        <mat-spinner diameter="20" *ngIf="isLoading"></mat-spinner>
      </button>

      <div class="form-footer">
        <a routerLink="/login" class="back-link">
          <mat-icon>arrow_back</mat-icon>
          Back to Login
        </a>
      </div>
    </form>
  </div>
</div>
